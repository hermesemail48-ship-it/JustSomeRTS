subprojects {
    repositories {
        mavenCentral()
        google()
    }
    plugins.withType(JavaPlugin) {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 8
            options.compilerArgs += ['-nowarn', '-Xlint:none', '-Xmaxerrs', '2000']
        }
    }
}
